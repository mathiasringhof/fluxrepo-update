apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: demo}
spec:
  values:
    image: {repository: "{{registry}}/demo/root", tag: "2.0.0"}
    sharedImage: {repository: "{{registry}}/demo/shared", tag: "2.0.0"}
    nested:
      helper:
        image:
          registry: "{{registry}}"
          repository: demo/helper
          tag: "2.0.0" # keep tag comment
      prefixed:
        image: {registry: "{{registry}}", repository: "{{registry}}/demo/prefixed", tag: "2.0.0"}
