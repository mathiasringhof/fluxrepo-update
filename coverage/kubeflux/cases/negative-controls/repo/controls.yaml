apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-controls
  annotations: {deployment.kubernetes.io/revision: "42"}
data:
  network-data: |
    version: 2
    ethernets: {}
  syslog.conf: '@version: 4.0'
  nfs-options: 'vers=4.1'
  cni.json: '{"cniVersion": "1.0.0"}'
  arbitrary: '123.456'
  ordinaryDisk: /var/lib/vm-102/root.qcow2
sops:
  version: 3.8.1
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
# - https://example.invalid/releases/v99.0.0/operator.yaml
patches:
- target: {group: apps, version: v1, kind: Deployment}
  patch: |-
    - op: add
      path: /metadata/annotations/rollout
      value: "20260901"
