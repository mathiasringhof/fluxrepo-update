kind: HelmRelease
metadata: {name: photos}
spec:
  values:
    image: {repository: "{{registry}}/demo/helper", tag: "2.0.0"}
  postRenderers:
  - kustomize:
      patches:
      - target: {kind: Deployment, name: photos}
        patch: |-
          - op: add
            path: /spec/template/spec/initContainers
            value:
            - name: initialize
              image: example/busybox:1.36
