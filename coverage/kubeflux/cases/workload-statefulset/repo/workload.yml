apiVersion: apps/v1
kind: StatefulSet
metadata: {name: statefulset}
spec:
  template:
    spec:
      containers:
        - name: app
          image: "{{registry}}/demo/statefulset:1.0.0" # keep
      initContainers:
        - name: app-init
          image: "{{registry}}/demo/statefulset-init:1.0.0" # keep
