apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata: {name: guest}
spec:
  template:
    spec:
      volumes:
      - name: installer
        hostDisk: {path: /var/lib/images/ubuntu-24.04.4-live-server-amd64.iso, type: Disk}
      - name: writable
        hostDisk: {path: /var/lib/images/guest-102-root.img, type: DiskOrCreate}
