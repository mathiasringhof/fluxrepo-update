apiVersion: batch/v1
kind: CronJob
metadata: {name: cronjob}
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: "{{registry}}/demo/cronjob:1.0.0" # keep
          initContainers:
            - name: app-init
              image: "{{registry}}/demo/cronjob-init:1.0.0" # keep
