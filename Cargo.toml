[package]
name = "fluxrepo-update"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "CLI tooling for discovering and updating FluxCD manifest versions"
license = "Apache-2.0"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
fn_params_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
todo = "deny"
unimplemented = "deny"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
rayon = "1.11.0"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
rustix = { version = "1.1.4", features = ["termios"] }
serde = "1.0.228"
serde_json = "1.0.145"
url = "2.5.7"
yaml-edit = "0.2.1"
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.24.0"

[lib]
name = "fluxrepo_update"
path = "src/lib.rs"

[[bin]]
name = "fluxrepo-update"
path = "src/main.rs"
